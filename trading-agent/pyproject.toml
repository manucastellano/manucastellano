[project]
name = "trading-agent"
version = "0.1.0"
description = "Brain/reflex crypto trading agent: Opus research + Jev per-candle decisions, deterministic risk in code."
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk==0.7.5",
    "anthropic==1.15.0",
    "pydantic>=2.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
